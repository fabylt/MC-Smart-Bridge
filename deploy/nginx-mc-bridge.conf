# /etc/nginx/sites-available/mc-bridge.conf
# Nginx Reverse Proxy per MC Smart Bridge su Oracle Cloud VM (ARM64 / x86_64)
# Abilitazione rapida:
#   sudo ln -s /etc/nginx/sites-available/mc-bridge.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d ricette.tuodominio.it

server {
    listen 80;
    listen [::]:80;
    server_name ricette.tuodominio.it;

    # Upload foto copertina ricette fino a 10 MB
    client_max_body_size 10M;

    # Protezione file nascosti e directory dati
    location ~ /\.(?!well-known) {
        deny all;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # Header reverse proxy per cookie HttpOnly/Secure e riconoscimento schema HTTPS
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Timeout estesi per chiamate AI Gemini e upload verso monsieur-cuisine.com
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # Disabilita buffering su risposte API
        proxy_buffering off;
    }
}

# Dopo aver eseguito `sudo certbot --nginx -d ricette.tuodominio.it`,
# Certbot aggiungerà automaticamente il blocco `listen 443 ssl http2;`
# con certificati Let's Encrypt e redirect automatico HTTP -> HTTPS.
